name: Fork checks

# Rules that only exist in this fork: commit format, separation between
# fork-only files and application code, signed commits, coding standard, and
# the tests on the PHP version of the instance. See CLAUDE.md.

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest

    env:
      BASE_REF: origin/${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    # Upstream commits do not follow the rules of the fork; knowing them lets
    # the checks skip them when a pull request merges upstream changes.
    - name: Fetch the upstream history
      run: git fetch --no-tags https://github.com/agorakit/agorakit.git "+refs/heads/main:refs/remotes/upstream/main"

    # The title becomes the subject of the merge commit.
    - name: Check the pull request title
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: .github/fork/check-commits.sh --subject "$PR_TITLE"

    - name: Check the commits
      run: .github/fork/check-commits.sh "$BASE_REF" "$HEAD_SHA"

    - name: Check that the commits are signed
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        status=0
        for commit in $(.github/fork/check-commits.sh --list "$BASE_REF" "$HEAD_SHA"); do
          title=$(git log -1 --format='%h %s' "$commit")
          verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '.commit.verification.verified')
          if [ "$verified" = "true" ]; then
            echo "ok    $title"
          else
            echo "FAIL  $title: GitHub does not see a verified signature"
            status=1
          fi
        done
        exit $status

  # The upstream workflow runs the tests only; the coding standard was not
  # checked anywhere.
  lint:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version-file: .github/fork/php-version

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.ci', '.env');"

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check the coding standard
      run: composer lint

  # The upstream workflow tests the minimum PHP of composer.json; this job
  # tests the PHP version of the instance, written in .github/fork/php-version,
  # with the same database.
  tests:
    runs-on: ubuntu-latest

    services:
        mysql:
            image: mysql:8.0
            env:
                MYSQL_DATABASE: agorakit_testing
                MYSQL_ROOT_PASSWORD: testrootpass
            ports:
                - 3306:3306
            options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:

    - uses: actions/checkout@v4

    - name: Setup PHP
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version-file: .github/fork/php-version

    - name: Show the PHP version
      run: php -v

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.ci', '.env');"

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Generate key
      run: php artisan key:generate

    - name: Directory permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run test suite
      run: composer run-script test
